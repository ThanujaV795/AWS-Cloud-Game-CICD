```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AWS Cloud Memory Game</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <h1>AWS CLOUD MEMORY GAME</h1>

        <p class="instructions">
            Test your memory by matching all the cards. 
            Select a difficulty level, start the game, and try to achieve the highest score!
        </p>

        <div class="game-controls">

            <label for="difficulty">Difficulty:</label>

            <select id="difficulty">
                <option value="easy">Easy</option>
                <option value="medium" selected>Medium</option>
                <option value="hard">Hard</option>
            </select>

            <button id="start-game">Start Game</button>

            <button id="restart-game">Restart</button>

        </div>

        <div class="game-info">

            <div class="info-card">
                <span>Score</span>
                <strong id="score">0</strong>
            </div>

            <div class="info-card">
                <span>Time</span>
                <strong id="timer">00:00</strong>
            </div>

            <div class="info-card">
                <span>Moves</span>
                <strong id="moves">0</strong>
            </div>

            <div class="info-card">
                <span>High Score</span>
                <strong id="high-score">0</strong>
            </div>

        </div>

        <div id="game-message" class="game-message"></div>

        <div id="game-board" class="game-board">
            <!-- Game cards will be generated by JavaScript -->
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
```
